name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' api/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match api/Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      # pull-only: push token lives in the release environment, not repo secrets
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: quackster

      - name: run checks
        run: nix flake check --print-build-logs

  publish:
    name: publish
    needs: verify
    permissions:
      contents: read # checkout
      packages: write # push images to ghcr
      id-token: write # sigstore signing identity
      attestations: write # store provenance
    uses: ./.github/workflows/publish.yml
    with:
      environment: release # v* tags only, requires manual approval
      tag: ${{ github.ref_name }}
    # env-scoped CACHIX_AUTH_TOKEN only resolves inside the job entering the
    # environment; explicit passing evaluates caller-side and comes up empty
    secrets: inherit # zizmor: ignore[secrets-inherit]

  release:
    name: create github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create github release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes
